<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام عمليات المزرعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fixed start-side navigation rail, a sticky context bar with role switcher and global search,
   one scrolling workspace per page, and record drawers that slide in from the end side. */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --surface-2:#edf2ec; --hover:#f4f8f3; --line:#d9e2d7; --line-strong:#bfcdbc;
  --fg:#17231b; --muted:#5a6a5f;
  --brand:#1f6f43; --brand-strong:#174f31; --brand-soft:#e3f1e8; --on-brand:#ffffff;
  --side-bg:#153a28; --side-fg:#e4f0e8; --side-muted:#9cbcaa; --side-hover:#1d4a34; --side-active:#2b6b4a;
  --ok:#1d7443; --ok-soft:#e1f3e7; --warn:#9a5700; --warn-soft:#fcefd8; --bad:#b42318; --bad-soft:#fde7e4;
  --info:#1c5e9c; --info-soft:#e2eefa; --qa:#5b3fa6; --qa-soft:#efeaf9; --neutral:#4e5d53; --neutral-soft:#e9eee8;
  --gh-idle:#e3e9e1; --gh-done:#a9c4b2;
  --shadow:0 1px 2px rgb(18 40 26 / .06), 0 6px 20px rgb(18 40 26 / .07);
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1511; --surface:#151f19; --surface-2:#1b2820; --hover:#1a261f; --line:#2a3a30; --line-strong:#3a4f42;
    --fg:#e3ece6; --muted:#9db1a4;
    --brand:#57b985; --brand-strong:#86d4a9; --brand-soft:#173826; --on-brand:#06130b;
    --side-bg:#0a110d; --side-fg:#d9e7de; --side-muted:#7d988a; --side-hover:#142019; --side-active:#1d3c2b;
    --ok:#62c88e; --ok-soft:#153824; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#f2847b; --bad-soft:#3d1a17;
    --info:#82b9ee; --info-soft:#132b42; --qa:#b9a3f0; --qa-soft:#2a2240; --neutral:#aab8ae; --neutral-soft:#222e27;
    --gh-idle:#223028; --gh-done:#3d5a48;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#151f19; --surface-2:#1b2820; --hover:#1a261f; --line:#2a3a30; --line-strong:#3a4f42;
  --fg:#e3ece6; --muted:#9db1a4;
  --brand:#57b985; --brand-strong:#86d4a9; --brand-soft:#173826; --on-brand:#06130b;
  --side-bg:#0a110d; --side-fg:#d9e7de; --side-muted:#7d988a; --side-hover:#142019; --side-active:#1d3c2b;
  --ok:#62c88e; --ok-soft:#153824; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#f2847b; --bad-soft:#3d1a17;
  --info:#82b9ee; --info-soft:#132b42; --qa:#b9a3f0; --qa-soft:#2a2240; --neutral:#aab8ae; --neutral-soft:#222e27;
  --gh-idle:#223028; --gh-done:#3d5a48;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{direction:rtl}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.num,td.n,.tab-num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;gap:14px;padding:18px 12px;z-index:35}
.side-brand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--side-active);display:grid;place-items:center}
.brand-mark svg{width:22px;height:22px}
.side-brand b{display:block;font-size:.98rem;line-height:1.3}
.side-brand small{color:var(--side-muted);font-size:.75rem}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:0;background:transparent;color:inherit;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:.92rem}
.nav button:hover{background:var(--side-hover)}
.nav button.on{background:var(--side-active);font-weight:600}
.nav .cnt{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:0 7px;line-height:1.6}
.nav-sep{font-size:.72rem;color:var(--side-muted);padding:10px 12px 2px;letter-spacing:.02em}
.persona{margin-top:auto;border:1px solid var(--side-hover);border-radius:12px;padding:12px;display:grid;gap:8px;background:rgb(255 255 255 / .03)}
.persona .lbl{font-size:.72rem;color:var(--side-muted)}
.persona .pn{font-weight:600;line-height:1.4}
.persona select{background:var(--side-hover);border:1px solid var(--side-active);color:var(--side-fg);border-radius:8px;padding:6px 8px;width:100%}
.side-foot{display:grid;gap:6px}
.side-foot button{border:1px solid var(--side-hover);background:transparent;color:var(--side-fg);border-radius:9px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.85rem}
.side-foot button:hover{background:var(--side-hover)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;flex-wrap:wrap}
.menu-btn{display:none}
.crumbs{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-width:0}
.crumbs b{color:var(--fg);font-weight:600}
.gs{position:relative;flex:1 1 260px;max-width:440px;margin-inline-start:auto}
.gs input{width:100%;padding-inline-start:36px}
.gs .ic{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.gs-res{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:30;padding:6px}
.gs-res button{display:flex;gap:10px;align-items:center;width:100%;text-align:start;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer}
.gs-res button:hover,.gs-res button:focus-visible{background:var(--hover)}
.gs-res .k{font-size:.72rem;color:var(--muted);min-width:56px}
.role-pick{display:flex;align-items:center;gap:8px}
.role-pick label{font-size:.8rem;color:var(--muted);white-space:nowrap}
.role-pick select{min-width:170px}
.strip{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--warn-soft);color:var(--fg);font-size:.8rem;padding:6px 24px;border-bottom:1px solid var(--line)}
.strip b{color:var(--warn)}
.strip button{margin-inline-start:auto}
.view{padding:22px 24px 56px;max-width:1480px;width:100%;margin-inline:auto;display:grid;gap:18px;align-content:start}

/* ---------- primitives */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);font-size:.88rem;margin-top:2px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.card-h .sub{color:var(--muted);font-size:.8rem}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.stack{display:grid;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:500;min-height:38px;font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.82rem}
.btn.locked{opacity:.62;border-style:dashed;cursor:not-allowed;background:transparent;color:var(--muted)}
.btn .ic{width:16px;height:16px}
.icon-btn{border:0;background:transparent;border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:inherit}
.icon-btn:hover{background:var(--surface-2)}
.lnk{border:0;background:none;padding:0;color:var(--brand);cursor:pointer;font:inherit;text-align:start;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--brand) 35%,transparent);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--brand)}
input,select,textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:7px 10px;min-height:38px;width:100%;font-size:.9rem}
textarea{min-height:76px;resize:vertical}
input[readonly]{background:var(--surface-2)}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.82rem;font-weight:600}
.field .hint{font-size:.76rem;color:var(--muted);font-weight:400}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.form-err{color:var(--bad);background:var(--bad-soft);border-radius:9px;padding:8px 12px;font-size:.86rem;margin-inline:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input{flex:1 1 220px;width:auto}
.filters select{flex:0 1 170px;width:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:99px;font-size:.76rem;font-weight:600;white-space:nowrap;line-height:1.7;background:var(--neutral-soft);color:var(--neutral)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-bad::before{border-radius:1px;transform:rotate(45deg)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-qa{background:var(--qa-soft);color:var(--qa)}
.p-brand{background:var(--brand-soft);color:var(--brand)}
.p-muted{background:var(--neutral-soft);color:var(--muted)}
.p-muted::before{background:transparent;border:1.5px solid currentColor}
.tag{display:inline-block;font-size:.72rem;border:1px dashed var(--line-strong);color:var(--muted);border-radius:6px;padding:0 6px;line-height:1.7;white-space:nowrap}
.tag.demo{border-color:var(--warn);color:var(--warn)}
.code{font-family:var(--mono);font-size:.84em;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}
.empty b{color:var(--fg)}
.note{background:var(--info-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:.84rem;display:flex;gap:8px;align-items:flex-start}
.note .ic{color:var(--info);margin-top:2px}
.note.warn{background:var(--warn-soft)}
.note.warn .ic{color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;color:var(--muted);font-weight:500}
.tabs button.on{border-color:var(--brand);color:var(--fg);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:7px;cursor:pointer;font-size:.85rem}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .12);font-weight:600}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:var(--surface-2);text-align:start;font-weight:600;color:var(--muted);font-size:.78rem;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.kpi{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;text-align:start;cursor:pointer;align-content:start}
.kpi:hover{border-color:var(--brand)}
.kpi .k{font-size:.82rem;color:var(--muted);font-weight:500}
.kpi .v{font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .d{font-size:.78rem;color:var(--muted)}
.kpi.t-bad .v{color:var(--bad)}
.kpi.t-warn .v{color:var(--warn)}
.kpi.t-qa .v{color:var(--qa)}

/* bars */
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:inherit}
.bar.over>i{background:var(--warn)}
.bar.low>i{background:var(--bad)}
.hbar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.hbar i{display:block;height:100%}
.c-ok{background:var(--ok)} .c-warn{background:var(--warn)} .c-bad{background:var(--bad)} .c-none{background:var(--gh-idle)} .c-info{background:var(--info)} .c-qa{background:var(--qa)} .c-done{background:var(--gh-done)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.blk-rows{display:grid;gap:12px}
.blk-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.85rem}

/* lists */
.list{display:grid;gap:0;list-style:none;margin:0;padding:0}
.list>li{border-top:1px solid var(--line);padding:10px 2px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.list>li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list .meta{font-size:.78rem;color:var(--muted)}
.alert-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.alert-ic.bad{background:var(--bad-soft);color:var(--bad)} .alert-ic.warn{background:var(--warn-soft);color:var(--warn)} .alert-ic.qa{background:var(--qa-soft);color:var(--qa)} .alert-ic.info{background:var(--info-soft);color:var(--info)}
.clickable{cursor:pointer;border-radius:8px}
.clickable:hover{background:var(--hover)}

/* flow */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.flow-step{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px;text-align:start;background:var(--surface);cursor:pointer}
.flow-step:hover{border-color:var(--brand)}
.flow-step .v{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.flow-step .k{font-size:.76rem;color:var(--muted)}
.qty-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.qty{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.qty .k{font-size:.74rem;color:var(--muted)}
.qty .v{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.qty.bad{background:var(--bad-soft)} .qty.bad .v{color:var(--bad)}
.qty.ok .v{color:var(--ok)}

/* stepper + timeline */
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.step{flex:1;min-width:84px;font-size:.74rem;padding-top:8px;border-top:4px solid var(--line);color:var(--muted);text-align:center}
.step.done{border-color:var(--brand);color:var(--fg)}
.step.cur{border-color:var(--brand);color:var(--brand);font-weight:700}
.step.alert{border-color:var(--bad);color:var(--bad);font-weight:700}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding-inline-start:22px;padding-block:2px 14px;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.tl li:last-child{border-color:transparent}
.tl li::before{content:"";position:absolute;inset-inline-start:-8px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:3px solid var(--brand)}
.tl li.bad::before{border-color:var(--bad)} .tl li.warn::before{border-color:var(--warn)} .tl li.qa::before{border-color:var(--qa)} .tl li.info::before{border-color:var(--info)}
.tl .t{font-size:.76rem;color:var(--muted)}

/* drawer / modal / toast */
.scrim{position:fixed;inset:0;background:rgb(8 18 12 / .42);z-index:40}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(620px,100%);background:var(--surface);box-shadow:var(--shadow);z-index:45;display:flex;flex-direction:column;border-inline-start:1px solid var(--line)}
.d-head{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.d-head .grow{flex:1;min-width:0}
.d-body{overflow-y:auto;padding:16px 18px 32px;display:grid;gap:16px;align-content:start;grid-auto-rows:max-content;flex:1;min-height:0}
.d-sec{display:grid;gap:8px}
.d-sec>h3{font-size:.86rem;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.kv div{display:grid;gap:1px;min-width:0}
.kv dt{font-size:.74rem;color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:var(--surface-2);border-radius:10px}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgb(8 18 12 / .5);padding:16px}
.modal-box{width:min(600px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-body{padding:16px 18px;display:grid;gap:12px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);margin-top:12px}
.toasts{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:.88rem;max-width:min(560px,100%);display:flex;gap:8px;align-items:center;animation:tin .18s ease-out}
.toast.bad{background:var(--bad);color:#fff}
.toast.warn{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
@keyframes tin{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}

/* map */
.map-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.farm-frame{border:2px dashed var(--line-strong);border-radius:16px;padding:14px;display:grid;gap:12px;position:relative}
.farm-frame>.cap{font-size:.76rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.tiles.sec{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.tile{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;cursor:pointer;text-align:start;display:grid;gap:8px;min-width:0}
.tile:hover{border-color:var(--brand)}
.tile .th{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .ts{font-size:.76rem;color:var(--muted)}
.mg{display:grid;gap:3px;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr))}
.mg i{display:block;aspect-ratio:1.5;border-radius:2px}
.s-idle{background:var(--gh-idle)} .s-done{background:var(--gh-done)} .s-planned{background:var(--info)} .s-review{background:var(--qa)} .s-active{background:var(--ok)} .s-alert{background:var(--bad)}
.gh-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.gh{border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;padding:0;display:grid;grid-template-rows:6px auto;overflow:hidden;min-height:68px;text-align:center}
.gh>i{display:block}
.gh span{padding:6px 2px;font-size:.78rem;display:grid;gap:1px;align-content:center}
.gh small{font-size:.66rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh:hover{border-color:var(--brand)}
.gh.sel{outline:3px solid var(--brand);outline-offset:1px}
.path-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.9rem}
.path-bar .sep{color:var(--muted)}

/* misc components */
.av{width:46px;height:46px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-weight:700;flex:none}
.att-days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.att-days i{display:block;height:24px;border-radius:4px}
.att-days small{font-size:.62rem;color:var(--muted);text-align:center;display:block}
.task-card{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.task-card .th{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qr{width:112px;height:112px;flex:none;background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line)}
.qr rect{fill:#111}
.perm-tbl td,.perm-tbl th{text-align:center}
.perm-tbl td:first-child,.perm-tbl th:first-child{text-align:start}
.perm-tbl input{width:18px;height:18px;min-height:0;accent-color:var(--brand)}
.yes{color:var(--ok);font-weight:700}
.no{color:var(--muted)}
.ev-tbl td{font-size:.84rem}
.sev{width:4px;border-radius:4px;align-self:stretch;flex:none}

@media (max-width: 1100px){
  .map-layout{grid-template-columns:1fr}
}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(290px,86vw);height:100%;transform:translateX(105%);transition:transform .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.nav-open .side{transform:none}
  .menu-btn{display:grid}
  .top{padding:8px 16px}
  .strip{padding:6px 16px}
  .view{padding:16px 16px 48px}
  .gs{order:5;flex-basis:100%;max-width:none}
  .role-pick label{display:none}
  .role-pick select{min-width:0}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .gh-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi .v{font-size:1.45rem}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

}
function untilTxt(t) {
  const m = Math.round((t - Date.now()) / MIN);

  if (m < 60) return `خلال ${m} د`;

}
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

    tying: `تربيط النباتات وتسليكها على الخيوط في البيت ${g}`,
    planting: `زراعة شتول في البيت ${g} حسب خطة الزراعة (الصنف غير مؤكد بعد)`,
    spraying: `رش وقائي لبيوت القسم ${loc.section}. المادة والمعدل يحددهما المهندس (غير مؤكد بعد)`,
    cleaning: `تنظيف وتعقيم بيوت القسم ${loc.section} بعد نهاية العروة`,
    weeding: `إزالة الأعشاب في الممرات المكشوفة للقسم ${loc.section}`,
    irrigation: `فحص خطوط التنقيط في القسم ${loc.section} والإبلاغ عن الانسدادات`

}

/* =====================================================================
   توليد بيانات العرض — مجموعة واحدة مترابطة تشترك فيها كل الصفحات
   ===================================================================== */
function seedData(cfg) {
  const R = rng(9137 + cfg.workers * 3 + cfg.blocks * 101 + cfg.sections * 7 + cfg.greenhouses);
  const pick = a => a[Math.floor(R() * a.length)];
  const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
  const T0 = Date.now();
  const d6 = new Date(T0); d6.setHours(6, 0, 0, 0);
  const dayStart = Math.min(T0 - 150 * MIN, d6.getTime());
  const cap = t => Math.min(t, T0 - 2 * MIN);
  const used = new Set();
  const person = () => { let n; for (let i = 0; i < 40; i++) { n = `${pick(FIRST)} ${pick(MID)} ${pick(LAST)}`; if (!used.has(n)) break; } used.add(n); return n; };

  const S = {
    version: VERSION, cfg: { ...cfg }, seededAt: T0, dayStart, perms: defaultPerms(), persona: { role: 'ops_manager', ref: null },
    engineers: [], supervisors: [], teams: [], workers: [], attendance: {}, tasks: [], batches: [], submissions: [], staff: {},
    seq: { task: 1000, batch: 0, rec: 0 }
  };
  for (let b = 1; b <= cfg.blocks; b++) S.engineers.push({ id: 'E' + b, name: 'م. ' + person(), block: b });
  S.staff = { admin: 'مدير النظام (حساب عرض)', ops_manager: person(), custodian: person(), packing: person() };

  const assigned = Math.round(cfg.workers * 0.96);
  const nTeams = Math.max(1, Math.ceil(assigned / cfg.teamSize));
  const perBlock = Math.ceil(nTeams / cfg.blocks);
  const nSup = Math.ceil(nTeams / 2);
  for (let s = 1; s <= nSup; s++) S.supervisors.push({ id: 'SP' + pad(s), name: person(), teams: [] });
  for (let t = 1; t <= nTeams; t++) {
    const block = Math.min(cfg.blocks, Math.floor((t - 1) / perBlock) + 1);
    const sup = S.supervisors[Math.floor((t - 1) / 2)];
    const team = { id: 'T' + pad(t), name: 'طاقم ' + pad(t), supId: sup.id, block, section: ri(1, cfg.sections) };
    sup.teams.push(team.id); S.teams.push(team);
  }
  const teamById = new Map(S.teams.map(t => [t.id, t]));
  const supById = new Map(S.supervisors.map(s => [s.id, s]));

  for (let i = 1; i <= cfg.workers; i++) {
    const r = R();
    const status = r < 0.035 ? 'leave' : r < 0.05 ? 'inactive' : 'active';
    const team = i <= assigned ? S.teams[(i - 1) % nTeams] : null;
    S.workers.push({ id: 'W' + pad(i, 4), name: person(), badge: 'BD-' + (10000 + i), teamId: team ? team.id : null, status, joined: T0 - ri(20, 1600) * DAY, history: [] });
  }

  /* الحضور: حدث مسجّل من المشرف أو مسح بطاقة (محاكاة) — لا يثبت الموقع */
  const rollAt = {};
  S.teams.forEach(t => { rollAt[t.id] = dayStart + ri(-10, 10) * MIN; });
  for (const w of S.workers) {
    if (w.status !== 'active' || !w.teamId) continue;
    const t = teamById.get(w.teamId), sup = supById.get(t.supId), base = rollAt[t.id], r = R();
    const area = { block: t.block, section: t.section };
    if (r < 0.03) continue;
    if (r < 0.09) { S.attendance[w.id] = { st: 'absent', in: null, out: null, by: sup.name, method: 'manual', at: cap(base + ri(25, 40) * MIN), area }; continue; }
    const late = r < 0.14;
    const tin = cap(base + (late ? ri(20, 55) : ri(0, 14)) * MIN);
    const out = r > 0.992 ? cap(tin + ri(60, 140) * MIN) : null;
    S.attendance[w.id] = { st: out ? 'out' : late ? 'late' : 'present', in: tin, out, by: sup.name, method: R() < 0.7 ? 'badge' : 'manual', at: out || tin, area };
  }

  /* المهام */
  const TYPE_W = ['harvest', 'harvest', 'harvest', 'harvest', 'pruning', 'tying', 'planting', 'spraying', 'cleaning', 'weeding', 'irrigation'];
  const ST_W = [['planned', 8], ['assigned', 12], ['in_progress', 30], ['blocked', 5], ['pending_verification', 12], ['verified', 6], ['closed', 23], ['cancelled', 4]];
  const wpick = () => { let x = R() * 100; for (const [k, w] of ST_W) { if ((x -= w) < 0) return k; } return 'in_progress'; };
  const PATHS = {
    planned: [], assigned: ['assign'], in_progress: ['assign', 'start'], blocked: ['assign', 'start', 'block'],
    pending_verification: ['assign', 'start', 'submit'], verified: ['assign', 'start', 'submit', 'verify'],
    closed: ['assign', 'start', 'submit', 'verify', 'close']
  };
  const nT = Math.round(nTeams * 2.4);
  for (let i = 0; i < nT; i++) {
    const team = S.teams[i % nTeams];
    const type = i < nTeams && i % 3 === 0 ? 'harvest' : pick(TYPE_W);
    const tt = TASK_TYPES[type];
    let status = i < nTeams ? pick(['in_progress', 'in_progress', 'assigned', 'pending_verification', 'in_progress']) : wpick();
    const loc = { block: team.block, section: R() < 0.8 ? team.section : ri(1, cfg.sections), gh: tt.scope === 'greenhouse' ? ri(1, cfg.greenhouses) : null };
    let planned = tt.int ? Math.round(ri(tt.min, tt.max) / tt.step) * tt.step : Math.round((tt.min + R() * (tt.max - tt.min)) * 2) / 2;
    if (tt.unit === 'بيت محمي') planned = Math.min(planned, cfg.greenhouses);
    const eng = S.engineers[loc.block - 1], sup = supById.get(team.supId);
    const finished = ['verified', 'closed'].includes(status);
    const createdAt = finished ? T0 - ri(26, 90) * HR : dayStart - ri(2, 30) * HR;
    let path;
    if (status === 'cancelled') path = R() < 0.5 ? ['cancel'] : ['assign', 'cancel'];
    else path = PATHS[status].slice();
    if ((status === 'in_progress' || status === 'pending_verification') && R() < 0.15) {
      const idx = path.indexOf('start') + 1; path.splice(idx, 0, 'submit', 'sendback');
    }
    const hasTeam = path.includes('assign');
    const task = {
      id: 'T-' + (++S.seq.task), type, desc: taskDesc(type, loc), loc, teamId: hasTeam ? team.id : null, supId: hasTeam ? team.supId : null,
      planned, unit: tt.unit, status: 'planned', due: 0, createdAt, createdBy: eng.name, records: [], history: [], blockReason: null, sendBacks: 0
    };
    task.history.push({ at: createdAt, by: eng.name, role: 'مهندس', action: 'إنشاء المهمة', to: 'planned', note: '' });
    const endAt = finished ? createdAt + ri(14, 22) * HR : T0 - ri(5, 40) * MIN;
    const steps = path.length;
    let startAt = null, submitAt = null;
    path.forEach((k, j) => {
      const at = Math.round(createdAt + (endAt - createdAt) * ((j + 1) / (steps + (finished ? 0.3 : 0.6))));
      const actor = ({ assign: [eng.name, 'مهندس'], start: [sup.name, 'مشرف'], block: [sup.name, 'مشرف'], submit: [sup.name, 'مشرف'], verify: [eng.name, 'مهندس'], sendback: [eng.name, 'مهندس'], close: [S.staff.ops_manager, 'مدير العمليات'], cancel: [eng.name, 'مهندس'] })[k];
      let note = '';
      if (k === 'block') { task.blockReason = pick(BLOCK_REASONS); note = task.blockReason; }
      if (k === 'sendback') { note = 'الكمية المسجلة لا تطابق العدّ الميداني، يرجى التصحيح'; task.sendBacks++; }
      if (k === 'cancel') note = 'أُعيدت جدولة العمل ضمن مهمة أخرى';
      if (k === 'assign') note = `${team.name} · ${sup.name}`;
      const from = task.status;
      task.status = TT[k].to;
      task.history.push({ at, by: actor[0], role: actor[1], action: TT[k].l, from, to: task.status, note });
      if (k === 'start' && !startAt) startAt = at;
      if (k === 'submit') submitAt = at;
    });
    if (startAt) {
      const frac = { in_progress: 0.2 + R() * 0.55, blocked: 0.1 + R() * 0.35, pending_verification: 0.9 + R() * 0.16, verified: 0.92 + R() * 0.12, closed: 0.93 + R() * 0.1 }[status] || 0;
      let total = planned * frac;
      total = tt.int ? Math.max(1, Math.round(total)) : Math.max(0.5, Math.round(total * 2) / 2);
      const n = Math.min(total >= 3 ? ri(1, 3) : 1, tt.int ? total : 3);
      const recEnd = submitAt || (T0 - 10 * MIN);
      let left = total;
      for (let k = 0; k < n; k++) {
        let q = k === n - 1 ? left : (tt.int ? Math.round(total / n) : Math.round(total / n * 2) / 2);
        q = Math.min(q, left); left = +(left - q).toFixed(2);
        if (q <= 0) continue;
        const at = Math.round(startAt + (recEnd - startAt) * ((k + 1) / (n + 0.2)));
        task.records.push({ id: 'R' + (++S.seq.rec), qty: q, workers: ri(8, Math.max(9, cfg.teamSize - 4)), hours: ri(4, 12) / 2, at, by: sup.name, note: '' });
      }
    }
    task.due = ACTIVE_ST.includes(status) ? (status === 'planned' ? T0 + ri(6, 30) * HR : T0 + ri(-4, 9) * HR + ri(0, 50) * MIN) : createdAt + ri(10, 26) * HR;
    S.tasks.push(task);
  }

  /* دفعات الصناديق المرتبطة بمهام الحصاد */
  const yymmdd = (() => { const d = new Date(T0); return String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()); })();
  const newBatchId = () => `BX-${yymmdd}-${pad(++S.seq.batch, 3)}`;
  const mkBatch = (t, issued, issuedAt) => {
    const team = teamById.get(t.teamId);
    return {
      id: newBatchId(), teamId: t.teamId, supId: team.supId, loc: { ...t.loc }, taskId: t.id, issued, issuedAt, issuedBy: S.staff.custodian,
      dispatched: null, dispatchedAt: null, dispatchedBy: null, received: null, receivedAt: null, receivedBy: null, receiveNote: '',
      fieldReturned: 0, fieldReturnedAt: null, phReturned: 0, phReturnedAt: null, status: 'issued', closedWithDiff: false, closeNote: '', reconciledAt: null, events: []
    };
  };
  for (const t of S.tasks.filter(x => x.type === 'harvest' && x.teamId)) {
    const sup = supById.get(t.supId);
    const total = t.records.reduce((a, r) => a + r.qty, 0);
    const startAt = (t.history.find(h => h.to === 'in_progress') || {}).at;
    if (startAt && total > 0) {
      const chunks = []; let left = total;
      while (left > 0) { const c = Math.min(left, ri(40, 70)); chunks.push(c); left -= c; }
      chunks.forEach((c, k) => {
        const last = k === chunks.length - 1;
        const issuedAt = cap(startAt - 30 * MIN + k * 50 * MIN);
        const b = mkBatch(t, c + (R() < 0.6 ? ri(1, 8) : 0), issuedAt);
        b.dispatched = c; b.dispatchedBy = sup.name;
        b.dispatchedAt = cap(issuedAt + ri(60, 140) * MIN);
        let st;
        if (['verified', 'closed'].includes(t.status)) st = 'reconciled';
        else if (t.status === 'pending_verification') st = R() < 0.5 ? 'received' : 'returning';
        else st = last ? 'in_transit' : (R() < 0.55 ? 'received' : 'returning');
        if (st === 'in_transit') b.dispatchedAt = cap(T0 - ri(12, 100) * MIN);
        if (st !== 'in_transit') {
          b.received = c; b.receivedBy = S.staff.packing; b.receivedAt = cap(b.dispatchedAt + ri(15, 45) * MIN);
        }
        if (st === 'returning') {
          b.phReturned = ri(Math.floor(c * 0.4), c); b.phReturnedAt = cap(b.receivedAt + ri(20, 90) * MIN);
          if (b.issued > c && R() < 0.5) { b.fieldReturned = b.issued - c; b.fieldReturnedAt = cap(b.dispatchedAt + ri(5, 30) * MIN); }
        }
        if (st === 'reconciled') {
          b.phReturned = c; b.phReturnedAt = cap(b.receivedAt + ri(30, 120) * MIN);
          b.fieldReturned = b.issued - c; b.fieldReturnedAt = b.fieldReturned ? cap(b.dispatchedAt + ri(5, 30) * MIN) : null;
          b.reconciledAt = cap(b.phReturnedAt + ri(30, 180) * MIN);
        }
        b.status = st;
        S.batches.push(b);
      });
    }
    if (['assigned', 'in_progress'].includes(t.status) && R() < 0.7) {
      const b = mkBatch(t, ri(4, 8) * 10, cap(T0 - ri(15, 140) * MIN));
      S.batches.push(b);
    }
  }
  /* فروقات تجريبية مقصودة لعرض التسوية */
  const recv = S.batches.filter(b => b.status === 'received' || b.status === 'returning');
  recv.slice(0, 3).forEach((b, i) => {
    b.received = b.dispatched - (i + 2); b.receiveNote = 'عدّ بيت التعبئة أقل من الكمية المرسلة';
    b.phReturned = Math.min(b.phReturned, b.received);
  });
  const rec = S.batches.filter(b => b.status === 'reconciled');
  if (rec[0]) { const b = rec[0]; b.received = b.dispatched - 2; b.receiveNote = 'صندوقان تالفان عند التفريغ'; b.phReturned = b.received; b.closedWithDiff = true; b.closeNote = 'اعتُمد الفرق: صندوقان تالفان، أُبلغ المستودع'; }
  const tr = S.batches.filter(b => b.status === 'in_transit');
  if (tr[0]) tr[0].dispatchedAt = cap(T0 - 205 * MIN);
  S.batches.forEach(b => buildBatchEvents(S, b));

  /* إرسال كشوف حضور سابقة لبعض المشرفين */
  S.supervisors.forEach((sp, i) => {
    if (i % 3 === 2) return;
    const c = rollCounts(S, sp.teams);
    S.submissions.push({ supId: sp.id, at: cap(dayStart + ri(35, 70) * MIN), by: sp.name, ...c });
  });
  return S;
}

function locText(l) {
  if (!l) return '—';
  let s = `بلوك ${l.block} › القسم ${l.section}`;
  if (l.gh) s += ` › بيت ${pad(l.gh)}`; else s += ' (القسم كله)';
  return s;
}
function buildBatchEvents(S, b) {
  const sup = S.supervisors.find(s => s.id === b.supId);
  const field = `الحقل · ${locText(b.loc)}`;
  const ev = [{ at: b.issuedAt, type: 'issue', qty: b.issued, from: 'المستودع', to: field, by: b.issuedBy, note: '' }];
  if (b.dispatchedAt) ev.push({ at: b.dispatchedAt, type: 'dispatch', qty: b.dispatched, from: field, to: 'بيت التعبئة', by: b.dispatchedBy || sup.name, note: '' });
  if (b.fieldReturnedAt && b.fieldReturned) ev.push({ at: b.fieldReturnedAt, type: 'return_field', qty: b.fieldReturned, from: field, to: 'المستودع', by: sup.name, note: 'صناديق لم تُستخدم' });
  if (b.receivedAt) ev.push({ at: b.receivedAt, type: 'receive', qty: b.received, from: 'نقل من الحقل', to: 'بيت التعبئة', by: b.receivedBy, note: b.receiveNote || '' });
  if (b.phReturnedAt && b.phReturned) ev.push({ at: b.phReturnedAt, type: 'return_ph', qty: b.phReturned, from: 'بيت التعبئة', to: 'المستودع', by: S.staff.packing, note: 'صناديق فارغة بعد التفريغ' });
  if (b.reconciledAt) ev.push({ at: b.reconciledAt, type: 'reconcile', qty: null, from: '', to: '', by: S.staff.custodian, note: b.closeNote || 'لا فروقات' });
  b.events = ev.sort((x, y) => x.at - y.at);
}
function rollCounts(S, teamIds) {
  let present = 0, absent = 0, none = 0;
  for (const w of S.workers) {
    if (!teamIds.includes(w.teamId) || w.status !== 'active') continue;
    const a = S.attendance[w.id];
    if (!a) none++; else if (a.st === 'absent') absent++; else present++;
  }
  return { present, absent, none };
}

let S = null, IX = null, storageOk = true;
const UI = {
  page: 'dashboard', drawer: null, gsq: '', map: { b: null, s: null, g: null }, wfTab: 'workers', wPage: 1, aPage: 1, supView: null, supTeam: null,
  f: {

function reindex() {

  S.workers.forEach(w => { IX.w.set(w.id, w); if (w.teamId) { if (!IX.members.has(w.teamId)) IX.members.set(w.teamId, []); IX.members.get(w.teamId).push(w); } });

}
const members = id => IX.members.get(id) || [];

const supOfTeam = id => { const t = IX.t.get(id); return t ? IX.sp.get(t.supId) : null; };

/* ---------- derived values */
const sumRec = t => +t.records.reduce((a, r) => a + r.qty, 0).toFixed(2);
const manHours = t => t.records.reduce((a, r) => a + r.workers * r.hours, 0);

function attOf(w) {

function bq(b) {

}

function actorName() { const r = role(); if (r === 'supervisor') return personaSup().name; if (r === 'engineer') return personaEng().name; return S.staff[r]; }
function abtn(a, rec, label, attrs, cls = 'btn sm') {

  }
  const flow = ['issued', 'in_transit', 'received', 'returning', 'reconciled'].map(st => {
    const bs = S.batches.filter(b => b.status === st);
    const boxes = bs.reduce((a, b) => a + (st === 'issued' ? b.issued : st === 'in_transit' ? b.dispatched : b.received || 0), 0);
    return `<button type="button" class="flow-step" data-act="kpi" data-k="bst:${st}"><span class="k">${BATCH_ST[st].l}</span><span class="v">${bs.length}</span><span class="k">${fmtN(boxes)} صندوق</span></button>`;
  }).join('');
  const tot = S.batches.reduce((a, b) => { a.i += b.issued; a.d += b.dispatched || 0; a.r += b.received || 0; a.ret += b.fieldReturned + b.phReturned; return a; }, { i: 0, d: 0, r: 0, ret: 0 });
  const feed = activityFeed(9);
  return pageHead('لوحة الإدارة', `${F_DATE.format(new Date())} · نظرة موحدة على القوى العاملة والمهام والصناديق`,

  <section class="kpis" aria-label="المؤشرات الرئيسية">
    ${kpi('القوى العاملة الفعّالة', fmtN(m.wActive), `من ${fmtN(m.wTotal)} مسجّل · ${m.leave} في إجازة · ${m.inactive} موقوف`, 'workers')}
    ${kpi('الحضور المسجّل اليوم', fmtN(m.present), `${pct(m.present, m.expected)}٪ من ${fmtN(m.expected)} متوقع · ${m.late} متأخر`, 'att-present')}
    ${kpi('غياب أو لم يُسجَّل', fmtN(m.absent + m.none), `${m.absent} غائب · ${m.none} بانتظار التسجيل`, 'att-gap', m.none > 0 ? 'warn' : '')}
    ${kpi('موزّعون على الطواقم', fmtN(m.allocated), `${m.unallocated} فعّال بلا طاقم · ${S.teams.length} طاقمًا · ${S.supervisors.length} مشرفًا`, 'unallocated')}
    ${kpi('مهام قيد التنفيذ', m.tInProg, `${m.tOpen} مخططة/مُسندة · ${m.tBlocked} متوقفة`, 'tasks-active')}
    ${kpi('مهام متأخرة', m.tOverdue, 'تجاوزت موعد الإنجاز ولم تُرسل للمراجعة', 'tasks-overdue', m.tOverdue ? 'bad' : '')}
    ${kpi('بانتظار المراجعة', m.tPending, `${m.tDone} معتمدة أو مغلقة`, 'tasks-pending', 'qa')}
    ${kpi('دفعات في الطريق', m.bTransit, `${fmtN(m.bTransitBoxes)} صندوقًا نحو بيت التعبئة`, 'batches-transit')}
    ${kpi('فروقات صناديق مفتوحة', m.bDisc, `${m.bDiscBoxes} صندوقًا ناقصًا · ${fmtN(m.bOutstanding)} لم يُعَد بعد`, 'batches-disc', m.bDisc ? 'bad' : '')}
  </section>
  <div class="grid-2">
    <section class="card"><div class="card-h"><h2>الحضور حسب البلوك</h2><span class="sub">حدث مسجّل من المشرفين، وليس تحققًا من الموقع</span></div>
      <div class="blk-rows">${blocks.map(x => `<div class="blk-row"><button type="button" class="lnk" data-act="map-go" data-b="${x.b}">بلوك ${x.b}</button>
        <div class="hbar" role="img" aria-label="حاضر ${x.a.p} من ${x.a.e}"><i class="c-ok" style="width:${pct(x.a.p - x.a.l, x.a.e)}%"></i><i class="c-warn" style="width:${pct(x.a.l, x.a.e)}%"></i><i class="c-bad" style="width:${pct(x.a.ab, x.a.e)}%"></i><i class="c-none" style="width:${pct(x.a.n, x.a.e)}%"></i></div>
        <span class="small num">${x.a.p}/${x.a.e}</span></div>`).join('')}</div>
      <div class="legend" style="margin-top:12px"><span><i class="c-ok"></i>حاضر</span><span><i class="c-warn"></i>متأخر</span><span><i class="c-bad"></i>غائب</span><span><i class="c-none"></i>لم يُسجَّل</span></div>
    </section>
    <section class="card"><div class="card-h"><h2>نشاط المزرعة</h2><span class="sub">مخطط توضيحي. اختر بلوكًا لفتحه</span></div>
      <div class="tiles">${blocks.map(x => {
        const secs = []; for (let s = 1; s <= S.cfg.sections; s++) secs.push(`<i class="s-${mapState(IX.secTasks.get(x.b + '-' + s) || [])}"></i>`);
        return `<button type="button" class="tile" data-act="map-go" data-b="${x.b}"><div class="th"><b>بلوك ${x.b}</b>${x.over ? pill('bad', x.over + ' تنبيه') : pill('ok', 'مستقر')}</div><div class="mg" style="--cols:${Math.min(S.cfg.sections, 8)}">${secs.join('')}</div><span class="ts">${x.teams.length} طاقم · ${x.a.p} حاضر · ${x.active} مهمة جارية</span></button>`;
      }).join('')}</div>
      <div style="margin-top:10px">${mapLegend()}</div>
    </section>
  </div>
  <div class="grid-2">
    <section class="card"><div class="card-h"><h2>الإنتاجية حسب نوع العمل</h2><span class="sub">كل نوع بوحدته، فلا تُجمع وحدات مختلفة في رقم واحد</span></div>
      <div class="tw"><table><thead><tr><th>نوع العمل</th><th>الوحدة</th><th class="n">المخطط</th><th class="n">المسجّل</th><th>الإنجاز</th><th class="n">ساعات عمل</th><th class="n">وحدة/ساعة عمل</th></tr></thead><tbody>${prodRows}</tbody></table></div>
      <p class="small muted" style="margin-top:8px">ساعات العمل = عدد العمال × الساعات في كل تسجيل. يشمل المهام المُسندة وما بعدها.</p>
    </section>
    <section class="card"><div class="card-h"><h2>تنبيهات واستثناءات</h2><span class="sub">${al.length} عنصرًا يحتاج متابعة</span></div>
      ${al.length ? `<ul class="list">${al.slice(0, 8).map(a => `<li class="clickable" data-act="open" data-kind="${a.kind}" data-id="${a.id}"><span class="alert-ic ${a.sev}">${ICON.alert}</span><div class="grow"><div>${esc(a.title)}</div><div class="meta">${esc(a.meta)}</div></div></li>`).join('')}</ul>${al.length > 8 ? `<p class="small muted">و${al.length - 8} تنبيهًا آخر في صفحات المهام والدفعات.</p>` : ''}` : empty('لا تنبيهات', 'لا مهام متأخرة أو فروقات مفتوحة الآن.')}
    </section>
  </div>
  <div class="grid-2">
    <section class="card"><div class="card-h"><h2>حركة الصناديق</h2><span class="sub">المستودع ← الحقل ← بيت التعبئة ← الإرجاع والتسوية</span></div>
      <div class="flow">${flow}</div>
      <div class="qty-grid" style="margin-top:12px"><div class="qty"><div class="k">صُرف من المستودع</div><div class="v">${fmtN(tot.i)}</div></div><div class="qty"><div class="k">أُرسل لبيت التعبئة</div><div class="v">${fmtN(tot.d)}</div></div><div class="qty"><div class="k">استُلم وعُدّ</div><div class="v">${fmtN(tot.r)}</div></div><div class="qty"><div class="k">أُعيد للمستودع</div><div class="v">${fmtN(tot.ret)}</div></div></div>
    </section>
    <section class="card"><div class="card-h"><h2>آخر النشاطات</h2><span class="sub">من سجل التغييرات الفعلي في هذا العرض</span></div>
      <ul class="list">${feed.map(e => `<li class="clickable" data-act="open" data-kind="${e.kind}" data-id="${e.id}"><span class="pill p-${e.c}" style="padding-inline:6px"></span><div class="grow"><div class="small">${esc(e.txt)}</div><div class="meta">${esc(e.by)} · ${ago(e.at)}</div></div></li>`).join('')}</ul>
    </section>
  </div>`;
}

/* =====================================================================
   خريطة المزرعة (مخطط توضيحي غير مساحي)
   ===================================================================== */
function pageMap() {
  const m = UI.map, cfg = S.cfg;
  const crumbs = [`<button type="button" class="lnk" data-act="map-go">المزرعة</button>`];
  if (m.b) crumbs.push(`<button type="button" class="lnk" data-act="map-go" data-b="${m.b}">بلوك ${m.b}</button>`);
  if (m.s) crumbs.push(`<button type="button" class="lnk" data-act="map-go" data-b="${m.b}" data-s="${m.s}">القسم ${m.s}</button>`);
  if (m.g) crumbs.push(`<b>بيت ${pad(m.g)}</b>`);
  const up = m.g ? `data-b="${m.b}" data-s="${m.s}"` : m.s ? `data-b="${m.b}"` : '';
  let main, panel;
  if (!m.b) {
    main = `<div class="farm-frame"><span class="cap">المزرعة · ${cfg.blocks} بلوكات · ${cfg.sections} أقسام لكل بلوك · ${cfg.greenhouses} بيتًا محميًا لكل قسم <span class="tag demo">افتراض تجريبي</span></span><div class="tiles">${range(cfg.blocks).map(b => {
      const tk = S.tasks.filter(t => t.loc.block === b), teams = S.teams.filter(t => t.block === b);
      const pres = teams.reduce((a, t) => a + teamAtt(t.id).present, 0);
      return `<button type="button" class="tile" data-act="map-go" data-b="${b}"><div class="th"><b>بلوك ${b}</b><span class="ts">${esc(engOfBlock(b).name)}</span></div><div class="mg" style="--cols:${Math.min(cfg.sections, 4)}">${range(cfg.sections).map(s => `<i class="s-${mapState(IX.secTasks.get(b + '-' + s) || [])}" style="aspect-ratio:2.2"></i>`).join('')}</div><span class="ts">${teams.length} طاقم · ${pres} حاضر · ${tk.filter(t => t.status === 'in_progress').length} جارية · ${tk.filter(t => isOverdue(t) || t.status === 'blocked').length} تنبيه</span></button>`;
    }).join('')}</div></div>`;
    panel = mapPanelFarm();
  } else if (!m.s) {
    main = `<div class="tiles sec">${range(cfg.sections).map(s => {
      const tk = IX.secTasks.get(m.b + '-' + s) || [];
      const teams = S.teams.filter(t => t.block === m.b && t.section === s);
      return `<button type="button" class="tile" data-act="map-go" data-b="${m.b}" data-s="${s}"><div class="th"><b>القسم ${s}</b><span class="pill p-${{ alert: 'bad', active: 'ok', review: 'qa', planned: 'info', done: 'brand', idle: 'muted' }[mapState(tk)]}">${MAPST[mapState(tk)]}</span></div><div class="mg" style="--cols:8">${range(cfg.greenhouses).map(g => `<i class="s-${mapState(tk.filter(t => t.loc.gh === g))}"></i>`).join('')}</div><span class="ts">${teams.length ? teams.map(t => t.name).join('، ') : 'لا طاقم مقيم'} · ${tk.filter(t => ACTIVE_ST.includes(t.status)).length} مهمة مفتوحة</span></button>`;
    }).join('')}</div>`;
    panel = mapPanelBlock(m.b);
  } else {
    const tk = IX.secTasks.get(m.b + '-' + m.s) || [];
    main = `<div class="gh-grid" role="group" aria-label="بيوت القسم">${range(cfg.greenhouses).map(g => {
      const gt = tk.filter(t => t.loc.gh === g && t.status !== 'cancelled'), st = mapState(gt);
      const top = gt.find(t => ACTIVE_ST.includes(t.status) || t.status === 'pending_verification') || gt[0];
      return `<button type="button" class="gh ${m.g === g ? 'sel' : ''}" data-act="map-go" data-b="${m.b}" data-s="${m.s}" data-g="${g}" aria-label="بيت ${g}: ${MAPST[st]}"><i class="s-${st}"></i><span><b class="num">بيت ${pad(g)}</b><small>${top ? TASK_TYPES[top.type].l : '—'}</small></span></button>`;
    }).join('')}</div>${tk.some(t => !t.loc.gh) ? `<p class="small muted" style="margin-top:10px">يوجد ${tk.filter(t => !t.loc.gh).length} مهمة على مستوى القسم كله (رش، تنظيف، ري، أعشاب) تظهر في اللوحة الجانبية.</p>` : ''}`;
    panel = m.g ? mapPanelGh(m.b, m.s, m.g) : mapPanelSection(m.b, m.s);
  }
  return pageHead('خريطة المزرعة', 'المزرعة ← البلوك ← القسم ← البيت المحمي. مخطط توضيحي للتنقل، والمواقع فيه ليست إحداثيات مساحية.',
    `<button type="button" class="btn" data-act="cfg">تعديل افتراض الهيكل</button>`) + `
  <div class="card" style="padding:10px 14px"><div class="row" style="justify-content:space-between"><nav class="path-bar" aria-label="مستوى الخريطة">${crumbs.join('<span class="sep">‹</span>')}</nav>
  <div class="row">${m.b ? `<button type="button" class="btn sm" data-act="map-go" ${up}>${ICON.up}رجوع مستوى</button>` : ''}${mapLegend()}</div></div></div>
  <div class="map-layout"><div class="card">${main}</div><aside class="card stack" aria-label="تفاصيل المنطقة المحددة">${panel}</aside></div>`;
}
const range = n => Array.from({ length: n }, (_, i) => i + 1);
function taskMini(t) { return `<li class="clickable" data-act="open" data-kind="task" data-id="${t.id}"><div class="grow"><div class="small"><span class="code">${t.id}</span> ${TASK_TYPES[t.type].l} ${t.loc.gh ? '· بيت ' + pad(t.loc.gh) : '· القسم كله'}</div><div class="meta">${t.teamId ? esc(teamLabel(t.teamId)) + ' · ' + esc(supName(t.supId)) : 'غير مُسندة'} · ${fmtN(sumRec(t))}/${fmtN(t.planned)} ${t.unit}</div></div>${tPill(t)}</li>`; }
function createHereBtn(loc) {
  return abtn('task.create', { loc }, `${ICON.plus}مهمة جديدة هنا`, `data-act="task-new" data-b="${loc.block}" data-s="${loc.section || ''}" data-g="${loc.gh || ''}"`, 'btn sm primary');
}
function mapPanelFarm() {
  const cfg = S.cfg;
  return `<h2>المزرعة</h2><div class="kv"><div><dt>البلوكات</dt><dd>${cfg.blocks}</dd></div><div><dt>الأقسام</dt><dd>${cfg.blocks * cfg.sections}</dd></div><div><dt>البيوت المحمية</dt><dd>${fmtN(cfg.blocks * cfg.sections * cfg.greenhouses)}</dd></div><div><dt>الطواقم</dt><dd>${S.teams.length}</dd></div></div>
  <div class="note warn">${ICON.info}<span>عدد الأقسام والبيوت <b>افتراض عرض مؤقت</b> وليس مسحًا للمزرعة. يمكن تغييره من «تعديل افتراض الهيكل»، وعندها تُولَّد البيانات من جديد.</span></div>
  <h3>المهندسون حسب البلوك <span class="tag demo">تسلسل تجريبي</span></h3>
  <ul class="list">${S.engineers.map(e => `<li class="clickable" data-act="map-go" data-b="${e.block}"><div class="grow"><div>بلوك ${e.block}</div><div class="meta">${esc(e.name)}</div></div>${pill('info', S.tasks.filter(t => t.loc.block === e.block && t.status === 'pending_verification').length + ' للمراجعة')}</li>`).join('')}</ul>`;
}
function mapPanelBlock(b) {
  const teams = S.teams.filter(t => t.block === b), tk = S.tasks.filter(t => t.loc.block === b);
  const act = tk.filter(t => ACTIVE_ST.includes(t.status) || t.status === 'pending_verification').sort((x, y) => (isOverdue(y) - isOverdue(x)) || x.due - y.due);
  return `<div class="row" style="justify-content:space-between"><h2>بلوك ${b}</h2>${createHereBtn({ block: b, section: 1 })}</div>
  <div class="kv"><div><dt>المهندس المسؤول</dt><dd>${esc(engOfBlock(b).name)}</dd></div><div><dt>الطواقم</dt><dd>${teams.length}</dd></div><div><dt>حاضر الآن</dt><dd>${teams.reduce((a, t) => a + teamAtt(t.id).present, 0)}</dd></div><div><dt>مهام مفتوحة</dt><dd>${act.length}</dd></div></div>
  <h3>الطواقم وأماكن عملها اليوم</h3>
  <ul class="list">${teams.map(t => { const a = teamAtt(t.id); return `<li class="clickable" data-act="open" data-kind="team" data-id="${t.id}"><div class="grow"><div>${t.name} · القسم ${t.section}</div><div class="meta">المشرف ${esc(supName(t.supId))} · حاضر ${a.present}/${a.expected}</div></div></li>`; }).join('')}</ul>
  <h3>المهام المفتوحة</h3>${act.length ? `<ul class="list">${act.slice(0, 8).map(taskMini).join('')}</ul>` : empty('لا مهام مفتوحة', 'أنشئ مهمة لهذا البلوك.')}`;
}
function mapPanelSection(b, s) {
  const tk = (IX.secTasks.get(b + '-' + s) || []).filter(t => t.status !== 'cancelled');
  const teams = S.teams.filter(t => t.block === b && t.section === s);
  const workTeams = [...new Set(tk.filter(t => t.teamId && (ACTIVE_ST.includes(t.status))).map(t => t.teamId))];
  const recs = tk.flatMap(t => t.records.map(r => ({ r, t }))).sort((x, y) => y.r.at - x.r.at).slice(0, 5);
  const bs = S.batches.filter(x => x.loc.block === b && x.loc.section === s);
  return `<div class="row" style="justify-content:space-between"><h2>بلوك ${b} › القسم ${s}</h2>${createHereBtn({ block: b, section: s })}</div>
  <div class="kv"><div><dt>المهندس</dt><dd>${esc(engOfBlock(b).name)}</dd></div><div><dt>طواقم مقيمة</dt><dd>${teams.map(t => open('team', t.id, t.name)).join('، ') || '—'}</dd></div><div><dt>طواقم لها مهام هنا</dt><dd>${workTeams.map(id => open('team', id, teamLabel(id))).join('، ') || '—'}</dd></div><div><dt>المشرفون</dt><dd>${[...new Set(workTeams.concat(teams.map(t => t.id)).map(id => IX.t.get(id).supId))].map(id => open('sup', id, supName(id))).join('، ') || '—'}</dd></div></div>
  <p class="small muted">اختر بيتًا من الشبكة لعرض تفاصيله.</p>
  <h3>مهام القسم (${tk.length})</h3>${tk.length ? `<ul class="list">${tk.slice(0, 10).map(taskMini).join('')}</ul>` : empty('لا مهام في هذا القسم', 'استخدم «مهمة جديدة هنا».')}
  <h3>آخر الكميات المسجّلة</h3>${recs.length ? `<ul class="list">${recs.map(({ r, t }) => `<li class="clickable" data-act="open" data-kind="task" data-id="${t.id}"><div class="grow"><div class="small">${qtyTxt(r.qty, t.unit)} · ${TASK_TYPES[t.type].l}</div><div class="meta">${esc(r.by)} · ${r.workers} عامل · ${ago(r.at)}</div></div></li>`).join('')}</ul>` : '<p class="small muted">لا كميات مسجلة بعد.</p>'}
  <h3>دفعات صناديق من القسم (${bs.length})</h3>${bs.length ? `<ul class="list">${bs.slice(0, 5).map(x => `<li class="clickable" data-act="open" data-kind="batch" data-id="${x.id}"><div class="grow"><div class="small code">${x.id}</div><div class="meta">${x.loc.gh ? 'بيت ' + pad(x.loc.gh) : ''} · ${x.issued} مصروف</div></div>${bPill(x)}</li>`).join('')}</ul>` : '<p class="small muted">لا دفعات.</p>'}`;
}
function mapPanelGh(b, s, g) {
  const sec = IX.secTasks.get(b + '-' + s) || [];
  const tk = sec.filter(t => t.loc.gh === g && t.status !== 'cancelled');
  const secWide = sec.filter(t => !t.loc.gh && ACTIVE_ST.includes(t.status));
  const teamIds = [...new Set(tk.filter(t => t.teamId).map(t => t.teamId))];
  const recs = tk.flatMap(t => t.records.map(r => ({ r, t }))).sort((x, y) => y.r.at - x.r.at);
  const bs = S.batches.filter(x => x.loc.block === b && x.loc.section === s && x.loc.gh === g);
  return `<div class="row" style="justify-content:space-between"><h2>بيت ${pad(g)}</h2>${createHereBtn({ block: b, section: s, gh: g })}</div>
  <p class="small muted">بلوك ${b} › القسم ${s} · المهندس ${esc(engOfBlock(b).name)}</p>
  <div class="kv"><div><dt>الطاقم المسند</dt><dd>${teamIds.map(id => open('team', id, teamLabel(id))).join('، ') || 'لا يوجد'}</dd></div><div><dt>المشرف</dt><dd>${[...new Set(teamIds.map(id => IX.t.get(id).supId))].map(id => open('sup', id, supName(id))).join('، ') || '—'}</dd></div><div><dt>المحصول</dt><dd class="muted">غير مؤكد بعد</dd></div></div>

function pageReports() {

function globalSearch(qs) {

  if (q.length < 2) return out;
  const ws = scopedWorkers();
  for (const w of ws) { if (w.name.includes(q) || w.id.toLowerCase().includes(ql) || w.badge.toLowerCase().includes(ql)) { out.push(['worker', w.id, 'عامل', `${w.name} · ${w.id}`]); if (out.length > 5) break; } }
  scopedTasks().filter(t => t.id.toLowerCase().includes(ql) || t.desc.includes(q)).slice(0, 4).forEach(t => out.push(['task', t.id, 'مهمة', `${t.id} · ${TASK_TYPES[t.type].l} · ${TASK_ST[t.status].l}`]));

    const o = MODAL; if (!o) return;
    let r;
    try { r = o.onSubmit(Object.fromEntries(new FormData(e.target)), e.target); } catch (err) { r = 'حدث خطأ غير متوقع: ' + err.message; console.error(err); }
    if (typeof r === 'string') { const el = $('#mErr'); el.textContent = r; el.hidden = false; el.scrollIntoView({ block: 'nearest' }); }
    else if (MODAL === o) closeModal();
  } else if (e.target.dataset.form === 'scan') { e.preventDefault(); scanBadge(); }
});
function onFieldChange(e) {
  const t = e.target;
  if (MODAL && MODAL.onChange && t.closest('#mForm')) { MODAL.onChange(t, $('#mForm')); return; }
  if (t.id === 'gsearch') { UI.gsq = t.value; return renderSearch(); }
  if (e.type === 'change' && t.id === 'roleSel') {
    S.persona = { role: t.value, ref: null }; UI.drawer = null; UI.supView = null; UI.supTeam = null; save();
    UI.page = homePage(); render(); toast(`تعمل الآن بدور ${roleL()}: ${actorName()}`); return;
  }
  if (e.type === 'change' && t.id === 'identSel') { S.persona.ref = t.value; UI.supTeam = null; UI.drawer = null; save(); render(); toast(`تعمل الآن باسم ${actorName()}`); return; }
  if (e.type === 'change' && t.id === 'supView') { UI.supView = t.value; UI.supTeam = null; return renderView(); }
  if (e.type === 'change' && t.dataset.perm) {
    const p = S.perms[t.dataset.role][t.dataset.perm], k = t.dataset.key;
    if (!hasAction('perms.edit') || t.dataset.role === 'admin') { t.checked = !t.checked; return toast('لا يمكن تعديل هذه الصلاحية.', 'warn'); }
    if (t.checked) { if (!p.includes(k)) p.push(k); } else S.perms[t.dataset.role][t.dataset.perm] = p.filter(x => x !== k);
    return commit(`حُدّثت صلاحيات ${ROLES[t.dataset.role].l} (محاكاة)`);
  }
  if (t.dataset.f) {
    if (e.type === 'input' && t.tagName === 'SELECT') return;
    const [g, k] = t.dataset.f.split('.'); UI.f[g][k] = t.value;
    if (g === 'workers') UI.wPage = 1; if (g === 'att') UI.aPage = 1;
    renderView();
  }
}
document.addEventListener('input', onFieldChange);
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox' || e.target.id === 'roleSel') onFieldChange(e); else if (MODAL && e.target.closest('#mForm')) onFieldChange(e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (MODAL) return closeModal();
    const r = $('#gsres'); if (r && !r.hidden) { r.hidden = true; return; }
    if (UI.drawer) { UI.drawer = null; return renderDrawer(); }
    document.body.classList.remove('nav-open');
  }
  if (e.key === 'Enter' && e.target.id === 'gsearch') { const f = $('#gsres button'); if (f) f.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('li.clickable,tr.click')) { e.preventDefault(); handleAction(e.target, e); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (PAGE_FN[h] && h !== UI.page) go(h); });

/* ---------- التشغيل */
function init() {
  S = load();
  if (!S) { S = seedData(DEFAULT_CFG); save(); }
  reindex();
  const h = location.hash.slice(1);
  if (PAGE_FN[h] && canPage(h)) UI.page = h; else UI.page = homePage();
  render();
  setInterval(() => { if (!MODAL && !document.hidden && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) { renderNav(); renderView(); } }, 60000);
}
init();
window.__AOP = { get S() { return S; }, metrics, bq, seedData };
})();

</script>
