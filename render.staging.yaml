# STAGING (test data only): the same image as production, with the invented DEMO farm, used for end-to-end tests on a
# public HTTPS address. Its free database expires after 30 days — never put real data here.
databases:
  - name: packhouse-staging-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
services:
  - type: web
    name: packhouse-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: claude/packhouse-ops-system-rrefgr
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: packhouse-staging-db, property: connectionString }
      - key: PH_JWT_SECRET
        generateValue: true
      - key: PH_AUTHENTICATOR_PASSWORD
        generateValue: true
      - key: PH_SERVER_DB_PASSWORD
        generateValue: true
      - key: PH_OWNER_SETUP_CODE
        generateValue: true
      - key: PH_DEMO
        value: "1"
      - key: PH_DEMO_PASSWORD
        sync: false
