# PRODUCTION: the packhouse system for real work. Business data lives only in the permanent PostgreSQL named by DATABASE_URL
# (Neon, free plan). The Owner adds DATABASE_URL on this service's Environment page (Render → packhouse → Environment);
# it is deliberately not declared here so applying the blueprint never needs the secret. The container keeps nothing. Secrets are
# generated by Render and never leave its dashboard. Every deploy keeps accounts, settings and records (migrations only add).
services:
  - type: web
    name: packhouse
    runtime: docker
    plan: free
    region: frankfurt
    branch: claude/packhouse-ops-system-rrefgr
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PH_JWT_SECRET
        generateValue: true
      - key: PH_AUTHENTICATOR_PASSWORD
        generateValue: true
      - key: PH_SERVER_DB_PASSWORD
        generateValue: true
      - key: PH_OWNER_SETUP_CODE
        generateValue: true
